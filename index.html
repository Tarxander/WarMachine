<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>War Machine Inc.</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: "Helvetica Neue", Arial, sans-serif;
      color: #ffffff;
      background: #04141c;
      position: relative;
    }

    /* Ambient blue and green glow layers */
    .ambient {
      position: fixed;
      inset: -20%;
      z-index: 0;
      background:
        radial-gradient(circle at 25% 30%, rgba(0, 140, 255, 0.55), transparent 45%),
        radial-gradient(circle at 75% 70%, rgba(0, 220, 140, 0.5), transparent 45%),
        radial-gradient(circle at 70% 20%, rgba(0, 190, 200, 0.35), transparent 40%),
        radial-gradient(circle at 20% 80%, rgba(20, 120, 90, 0.45), transparent 45%);
      filter: blur(40px);
      animation: drift 20s ease-in-out infinite alternate;
    }

    @keyframes drift {
      0%   { transform: translate(0, 0) rotate(0deg) scale(1); }
      50%  { transform: translate(-3%, 2%) rotate(6deg) scale(1.05); }
      100% { transform: translate(3%, -2%) rotate(-6deg) scale(1); }
    }

    .hero {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 0 16px;
    }

    h1 {
      font-size: clamp(2rem, 8vw, 6rem);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-shadow: 0 0 30px rgba(0, 200, 255, 0.45), 0 0 60px rgba(0, 255, 160, 0.25);
    }

    .subtext {
      margin-top: 1.25rem;
      font-size: clamp(0.95rem, 2.2vw, 1.35rem);
      font-weight: 300;
      letter-spacing: 0.05em;
      color: rgba(255, 255, 255, 0.85);
      line-height: 1.6;
    }

    @media (prefers-reduced-motion: reduce) {
      .ambient { animation: none; }
    }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <main class="hero">
    <h1>WAR MACHINE INC.</h1>
    <p class="subtext">Founded by Allen Studebaker, Max Lynn, Lucas Prather, Xander Leicht</p>
  </main>
</body>
</html>
